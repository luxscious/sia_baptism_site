<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>New RSVP — Athanasia's Baptism</title>

  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->

  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;1,400&family=Source+Sans+3:wght@300;400;600&display=swap');

    /* Reset */
    * { box-sizing: border-box; }
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; background-color: #fdf0f4; }

    /* Mobile responsive */
    @media only screen and (max-width: 620px) {
      .email-wrapper { width: 100% !important; }
      .content-table { width: 100% !important; }
      .col-half {
        display: block !important;
        width: 100% !important;
      }
      .col-half-spacer {
        display: none !important;
      }
      .header-pad { padding: 28px 20px 24px !important; }
      .details-pad { padding: 20px 16px !important; }
      .card-pad { padding: 14px 16px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #fdf0f4; font-family: 'Source Sans 3', Arial, sans-serif;">

  <!-- Outer wrapper -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #fdf0f4; min-height: 100vh;">
    <tr>
      <td align="center" style="padding: 32px 16px;">

        <!--[if mso]>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" align="center">
        <tr><td>
        <![endif]-->

        <!-- Inner content table -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="content-table" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 16px rgba(35, 50, 9, 0.08);">

          <!-- HEADER BAND -->
          <tr>
            <td style="background-color: #ffd9e2; border-bottom: 1px solid #efb8c7; padding: 32px 40px 28px;" class="header-pad">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td>
                    <!-- Eyebrow label -->
                    <p style="margin: 0 0 12px 0; font-family: 'Source Sans 3', Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5f3844;">
                      New RSVP &mdash; Athanasia's Baptism
                    </p>
                    <!-- Title -->
                    <h1 style="margin: 0 0 10px 0; font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 600; color: #745a35; line-height: 1.2;">
                      New RSVP Received
                    </h1>
                    <!-- Subtitle -->
                    <p style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; color: #3c4c21; line-height: 1.5;">
                      You have a new submission for Athanasia's Baptism.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- DETAILS SECTION -->
          <tr>
            <td style="background-color: #ffffff; padding: 28px 32px;" class="details-pad">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">

                <!-- Guest Name card (full width) -->
                <tr>
                  <td style="padding-bottom: 12px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td style="background-color: #f6f3ef; border: 1px solid #c6c8ba; border-radius: 4px; padding: 16px 20px;" class="card-pad">
                          <p style="margin: 0 0 5px 0; font-family: 'Source Sans 3', Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #745a35;">
                            Guest Name
                          </p>
                          <p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 400; color: #233209; line-height: 1.3;">
                            {{name}}
                          </p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Two-column row: Status + Total Guests -->
                <tr>
                  <td style="padding-bottom: 12px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <!-- Status card -->
                        <td class="col-half" style="width: 48%; vertical-align: top; background-color: #f6f3ef; border: 1px solid #c6c8ba; border-radius: 4px; padding: 16px 20px;">
                          <p style="margin: 0 0 5px 0; font-family: 'Source Sans 3', Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #745a35;">Status</p>
                          <p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 400; color: #233209; line-height: 1.3;">{{attending}}</p>
                        </td>

                        <!-- Spacer -->
                        <td style="width: 12px;">&nbsp;</td>

                        <!-- Total Guests card -->
                        <td class="col-half" style="width: 48%; vertical-align: top; background-color: #f6f3ef; border: 1px solid #c6c8ba; border-radius: 4px; padding: 16px 20px;">
                          <p style="margin: 0 0 5px 0; font-family: 'Source Sans 3', Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #745a35;">Total Guests</p>
                          <p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 400; color: #233209; line-height: 1.3;">{{guests}}</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Dietary Requirements card (full width) -->
                <tr>
                  <td style="padding-bottom: 12px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td style="background-color: #f6f3ef; border: 1px solid #c6c8ba; border-radius: 4px; padding: 16px 20px;" class="card-pad">
                          <p style="margin: 0 0 8px 0; font-family: 'Source Sans 3', Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #745a35;">
                            Dietary Requirements
                          </p>
                          <span style="display: inline-block; background-color: #ffd9e2; border-radius: 12px; padding: 3px 14px; font-family: 'Source Sans 3', Arial, sans-serif; font-size: 14px; color: #5f3844;">
                            {{dietary}}
                          </span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Message card (full width) -->
                <tr>
                  <td style="padding-bottom: 12px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td style="background-color: #f6f3ef; border: 1px solid #c6c8ba; border-radius: 4px; padding: 16px 20px;" class="card-pad">
                          <p style="margin: 0 0 5px 0; font-family: 'Source Sans 3', Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #745a35;">
                            Message for Athanasia
                          </p>
                          <p style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; color: #1c1c1a; line-height: 1.6;">
                            {{message}}
                          </p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Guest Email card (full width) -->
                <tr>
                  <td>
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td style="background-color: #f6f3ef; border: 1px solid #c6c8ba; border-radius: 4px; padding: 16px 20px;" class="card-pad">
                          <p style="margin: 0 0 5px 0; font-family: 'Source Sans 3', Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #745a35;">
                            Reply To
                          </p>
                          <a href="mailto:{{email}}" style="font-family: 'Source Sans 3', Arial, sans-serif; font-size: 15px; color: #745a35; text-decoration: none; border-bottom: 1px solid #efb8c7;">
                            {{email}}
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

          <!-- FOOTER BAND -->
          <tr>
            <td style="background-color: #ffd9e2; border-top: 1px solid #efb8c7; padding: 16px 32px; text-align: center;">
              <p style="margin: 0; font-family: 'Libre Caslon Text', Georgia, serif; font-size: 14px; color: #233209; letter-spacing: 0.02em;">
                The Gerges-Lewis Family
              </p>
            </td>
          </tr>

        </table>

        <!--[if mso]>
        </td></tr>
        </table>
        <![endif]-->

      </td>
    </tr>
  </table>

</body>
</html>
